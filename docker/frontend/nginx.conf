# 前端靜態檔與往後端的反向代理。這一跳一律轉發收到的原始 Host（$http_host），
# 不用 $host：後端在未設 CORS_ALLOWED_ORIGINS 時只接受同源請求，判斷方式是把請求的
# Origin 與 Host 相比，而 $host 只留主機名、會把埠丟掉。對外埠不是 443 時，
# 瀏覽器送出的 Origin 帶著埠、Host 卻沒有，需要憑證的請求就被判成跨源。
#
# 前面若還有一層代理（內建的 tls-proxy，或你自己的 ingress），那一層轉過來的 Host
# 同樣必須含對外埠——這裡只是原樣傳遞，補不回上游丟掉的資訊。

# 回應標頭與錯誤頁不帶 nginx 版本號。本檔掛在 conf.d 下、位於 http 層級。
server_tokens off;

# 依路徑決定 Cache-Control 的值，由 server 層級唯一一行 add_header 輸出。
# nginx 的 add_header 只在當層完全沒有 add_header 時才繼承上一層，所以任何 location
# 內都不寫 add_header，否則 server 層級的安全標頭會在那條 location 的回應上消失。
#   - /assets/：建置產物，檔名帶內容雜湊，內容變了檔名就變，可以快取一年並標不可變。
#   - /api、/ws：轉發給後端，快取語義由後端回應決定；空字串時 nginx 不輸出該標頭。
#   - 其餘（入口頁、單一頁面應用的路由回退、根目錄下檔名不帶雜湊的檔）：no-cache，
#     每次向伺服器確認，未變更時拿 304。路由回退是內部重導，$uri 已變成 /index.html。
map $uri $cx_cache_control {
    default            "no-cache";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/(api|ws)(/|$)   "";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA 路由處理。刻意不含 $uri/：建置產物本身有一個實體的 assets/ 目錄
    # （Vite 的 assetsDir），而前端也有 /assets 這條路由。目錄比對會讓該網址先命中
    # 實體目錄，目錄索引關閉時回 403，永遠落不到 index.html——直接輸入網址或重新整理
    # 就會看到伺服器的原始錯誤頁。單一頁面應用不需要目錄索引，少一項比對即可。
    location / {
        try_files $uri /index.html;
    }

    # API 代理到後端
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # 安全性 headers：只寫在 server 層級，location 內不得有 add_header（見檔頭 map 的說明）。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 快取標頭刻意不加 always：只附在 2xx／3xx 回應上，錯誤回應不會被瀏覽器記住一年。
    add_header Cache-Control $cx_cache_control;
}
