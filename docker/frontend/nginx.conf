# 前端靜態檔與往後端的反向代理。這一跳一律轉發收到的原始 Host（$http_host），
# 不用 $host：後端在未設 CORS_ALLOWED_ORIGINS 時只接受同源請求，判斷方式是把請求的
# Origin 與 Host 相比，而 $host 只留主機名、會把埠丟掉。對外埠不是 443 時，
# 瀏覽器送出的 Origin 帶著埠、Host 卻沒有，需要憑證的請求就被判成跨源。
#
# 前面若還有一層代理（內建的 tls-proxy，或你自己的 ingress），那一層轉過來的 Host
# 同樣必須含對外埠——這裡只是原樣傳遞，補不回上游丟掉的資訊。
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA 路由處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到後端
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # 快取靜態資源
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全性 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
