# Air 配置文件 - Go 熱重載工具
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # 版本號注入：CUSTODEXA_VERSION 由 docker/backend/Dockerfile.dev 烘進開發 image
  # （預設 dev）。Air 以 /bin/sh -c 執行本行，故 ${VAR:-預設} 會展開；host 直跑 air
  # 而未設該變數時同樣落在 dev。正式版的注入不走這裡，見 docker/backend/Dockerfile。
  cmd = 'go build -ldflags "-X main.Version=${CUSTODEXA_VERSION:-dev}" -o ./tmp/main ./cmd/server'
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "docker"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
