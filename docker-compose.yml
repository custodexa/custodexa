# 兩個入口形態的 frontend 共用同一份定義（同映像、同容器名、同建置），只差 profile 與是否發布埠。
# 任一時間只會啟用其一：profiles 互斥，同容器名也使 compose 拒絕兩者並存。
x-frontend: &frontend
  image: custodexa/frontend:latest
  pull_policy: never # Never pulled from a registry; built from this repository's source when the image is absent.
  build:
    context: .
    dockerfile: docker/frontend/Dockerfile
    target: production
  container_name: custodexa-frontend
  depends_on:
    - backend
  networks:
    - custodexa-network
  restart: always

# 部署形態由 .env 的 EXTERNAL_DB_HOST 與 TLS_MODE 決定，由 scripts/quickstart.sh 推導成
# COMPOSE_PROFILES 並寫進 .env 末尾的管理區（規則見 docs/QUICKSTART.md）。profiles：
#   bundled-db   內建 postgres（EXTERNAL_DB_HOST 空白時）
#   builtin-tls  內建 TLS 代理與憑證初始化（TLS_MODE 為 selfsigned 或 provided 時）
#   own-ingress  只發布 HTTP 埠給你自己的反向代理（TLS_MODE=external 時）
# 沒有跑過 quickstart.sh 時沒有任何 profile，不會有 postgres、代理與 frontend 啟動。
services:
  # PostgreSQL 資料庫
  #
  # 基底釘版（2026-08-17 查證）：一律釘到具體版本，不用浮動 major tag。理由有三，
  # 皆非潔癖：(1) AGPL 的「對應源碼」義務要指名交付二進位對應的是哪一版元件；
  # (2) 離線安裝包要能指名包內是哪一版；(3) 漏洞公告要能說「升到 X 版」——浮動 tag
  # 使 X 連自己都不知道。不釘版，這三件事都無法履行。
  # **postgres 是唯一同時「會出貨」且「原本未釘版」的基底**（node 只在建置階段），
  # 故優先序最高：這顆容器帶著使用者的全部資料跑在他們的機房裡。
  # 釘 18.6-alpine3.24（1.23.0 起；之前為 16.15-alpine3.24），digest 與安裝包 compose 相同。
  # **同時釘 alpine3.24 而非只釘 PG 版本**：這是執行階段映像，OS 套件層 CVE 直接落在使用者
  # 的執行環境，故基底 minor 也需可指名（與 frontend 的 nginx stage 同理，見
  # docker/frontend/Dockerfile）。
  # 資料目錄：18 的官方映像把資料放在 /var/lib/postgresql/18/docker，VOLUME 是上一層
  # /var/lib/postgresql，故主機的 ${DATA_PATH}/postgresql 掛到該處、不設 PGDATA。既有部署留在
  # ${DATA_PATH}/postgres 的 16 資料不會被讀到：quickstart.sh 在啟動前擋下並指向手動轉換程序。
  # 續期提醒：PostgreSQL 18 的社群支援至 2030-11；大版本不能靠換 tag 升級。
  postgres:
    profiles: ["bundled-db"]
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: custodexa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-custodexa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_PATH:-./data}/postgresql:/var/lib/postgresql
    networks:
      - custodexa-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Guacamole Daemon
  #
  # **直接引用 Apache Guacamole 官方映像，不經本專案重新包裝**（2026-09-29 查證）：
  # 本專案不修改這顆映像的內容，故由部署端直接向上游拉取。版本釘 1.6.0，並以 index
  # digest 釘住內容——上游曾重建同名 tag，digest 保證拉到的就是本專案驗證過的那一份
  # （amd64＋arm64 多架構 index）。1.6.0 是官方 releases 頁上的最新正式版（無 1.6.1）。
  # 釘版理由（AGPL 對應源碼／離線包／漏洞公告需可指名版本）見 docker/backend/Dockerfile 檔首。
  #
  # **已知風險，未解決（不要當成已修）**：
  # 1. 本映像基底為 **Alpine 3.18.12，該分支已 EOL**（3.18 於 2025-05-09 停止支援）。
  #    上游沒有任何較新基底的 tag 可換。唯一的真正解法是上游出新版，或自建 guacd 映像；
  #    兩者目前都未做。
  # 2. trivy 對本映像回報 0 項 HIGH/CRITICAL，**那是「沒有資料」不是「沒有漏洞」**：
  #    (a) EOL 分支不再有安全資料庫更新；(b) guacd 本體是 `/opt/guacamole` 下的 C
  #    二進位（libguac.so.25 等），不在 apk 套件資料庫內，套件掃描器看不見它。
  # 3. guacd 解析的是**目標主機送來的 RDP／VNC 協議資料**，而目標主機正是威脅模型裡
  #    假設可能已被入侵的一方——這是本產品最不能靠掃描器代勞的暴露面。
  #    人工追蹤點：https://guacamole.apache.org/security/ ，發版前比對 `guacd -v` 與上游最新版。
  #
  # **追蹤點（2026-09-29 查證）**：上游 1.6.1 尚未發布，正式 tag 出現後即把下方 `image:`
  # 的版本與 digest 換過去並複查基底層；換版本身是一行改動，不需要動程式碼。
  #
  # **部署方可將 `image:` 換成自建或自選映像**：本專案對這顆容器的要求只有三件——
  # 在 4822 提供 guacd 協議、能寫入編排檔掛入的錄影目錄（`/var/lib/custodexa/recordings`）、
  # 內含 `sh` 與 `nc` 供下方健康檢查（`nc -z 127.0.0.1 4822`）執行；缺第三項的映像會
  # 停在 `starting`，而 backend 以 `service_healthy` 為啟動前提，於是整套起不來。
  # 三者保留即可替換，映像的基底、建置方式與元件版本由部署方自行決定。
  #
  # 最小權限執行：guacd 解析的是被納管主機送回的 RDP／VNC 協議資料，而那一端在
  # 威脅模型裡就假設可能已被入侵，故這顆容器不保留任何非必要的能力。下列設定
  # 都是**執行期屬性**，與映像內容物無關——換成自建或自選映像後仍然生效。
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    container_name: custodexa-guacd
    # guacd 主程序以映像內的非特權身分執行，只需 bind/connect 與讀寫既有掛載點，
    # 不需任何 Linux capability。
    cap_drop:
      - ALL
    # 禁止子程序經 setuid／檔案 capability 取得比父程序更高的權限。
    security_opt:
      - no-new-privileges:true
    # 根檔案系統唯讀：協議解析被打穿時無法在容器內落下可執行檔或改寫設定。
    read_only: true
    tmpfs:
      # 唯讀根之下保留的兩塊可寫區，兩塊都是實測出來的，不是預防性給的：
      # (1) /tmp——RDP 磁碟重導的每連線暫存目錄由 backend 以 drive-path 指定在
      #     此之下（見 backend/internal/proxy/handler.go），少了它檔案傳輸建不起來。
      # (2) /home/guacd——FreeRDP 啟動時要求執行身分的家目錄可寫，唯讀根之下它會
      #     在安全協商階段就失敗（實測：RDP 連線回「Security negotiation failed」，
      #     VNC 不受影響）。內容只有 FreeRDP 自己的組態，本來就隨容器生滅，故以
      #     記憶體檔案系統供給即可，uid/gid 對到映像內的 guacd 身分。
      # 兩塊的掛載選項皆含 noexec／nosuid／nodev。
      - /tmp
      - /home/guacd:uid=1000,gid=1000,mode=0700
    volumes:
      # 與 backend 共享錄影目錄，讓 guacd 寫出的 RDP/VNC 錄影持久且 backend 可讀
      - ${DATA_PATH:-./data}/recordings:/var/lib/custodexa/recordings
    networks:
      - custodexa-network
    healthcheck:
      # 覆寫官方映像自帶的 HEALTHCHECK：其 interval 為 5 分鐘，backend 若以
      # service_healthy 等待，冷啟動最長要空等一整個週期。判定指令沿用官方的
      # 監聽埠檢查，只把節奏改成適合啟動序的長度。
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

  # Go 後端服務（生產模式）
  backend:
    # Drop unrelated capabilities; retain only the operations listed below.
    cap_drop: [ALL]
    cap_add:
      - SETUID # Switch DB CLI children to the dedicated user.
      - SETGID # Switch DB CLI children to the dedicated group.
      - CHOWN # Transfer temporary CA files to the DB CLI user.
      - KILL # Terminate DB CLI children running as a different user.
      - IPC_LOCK # Lock process memory without the memlock limit.
    # Prevent privilege gains through setuid executables.
    security_opt: [no-new-privileges:true]
    ulimits:
      # Disable core dumps with explicit soft and hard limits.
      core:
        soft: 0
        hard: 0
      memlock: -1 # Allow locking all current and future process memory.
    image: custodexa/backend:latest
    pull_policy: never # Never pulled from a registry; built from this repository's source when the image is absent.
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
      args:
        # 版本號建置時注入（/health 揭露的版號）。**空值是刻意的**：Dockerfile 於空值時
        # 回退讀專案根 VERSION 檔，那才是單一事實源——不設環境變數的一般建置因此
        # 自動拿到正確版號。
        # 設 VERSION 環境變數只用於覆寫，例：`VERSION=1.0.2-rc1 docker compose -f docker-compose.yml build`
        VERSION: ${VERSION:-}
    container_name: custodexa-backend
    # 使用者可調值（機密/DB 認證/DB_SSLMODE/功能開關/LDAP/運維上限）一律走 .env（與 dev 一致）
    env_file:
      - .env
    # environment: 只留純拓撲/模式常數（compose 提供，且不在 .env 內故無覆寫衝突）
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_DRIVER: postgres
      # 內建資料庫形態下 EXTERNAL_DB_HOST 空白，連到服務名 postgres；填了位址即連到你自己的伺服器。
      # 不直接讀 .env 的 DB_HOST：environment: 優先於 env_file，那個鍵填了也不生效。
      DB_HOST: ${EXTERNAL_DB_HOST:-postgres}
      DB_PORT: ${EXTERNAL_DB_PORT:-5432}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      AUDIT_LOG_PATH: /var/log/custodexa/audit
      RECORDING_PATH: /var/lib/custodexa/recordings
      # 非同步匯出產物（證據包、輪替證據報告、合規報告）的落點。與下方掛載成對：
      # 報告的保留期可長達數年，產物必須撐過容器重建（含每次升級）。
      # 顯式寫在這裡而非沿用程式預設，讓路徑與掛載點在同一份檔案裡對得上。
      EXPORT_ARTIFACT_PATH: /var/lib/custodexa/exports
      # 離機取回暫存根（容器本地快取、非 volume——刻意不掛出：內容是已驗證的
      # 明文副本，容器重建即消失、不進備份範圍）
      OFFSITE_SPOOL_PATH: /var/lib/custodexa/offsite-spool
    volumes:
      - ${DATA_PATH:-./data}/audit:/var/log/custodexa/audit
      - ${DATA_PATH:-./data}/recordings:/var/lib/custodexa/recordings
      # 匯出產物目錄：只有 backend 讀寫（以容器內 root 執行），啟動時由程式把目錄權限
      # 設為 0700、產物檔為 0600，主機端不需事先建立或 chown。證據包產物含解密後的
      # 明文，故這個目錄不列入備份指令的預設範圍（見 docs/ops/backup-and-restore.md §2）。
      - ${DATA_PATH:-./data}/exports:/var/lib/custodexa/exports
    depends_on:
      # required: false：外接資料庫形態不啟用 postgres 服務，backend 仍照常啟動；
      # 內建形態下 postgres 在堆疊內，仍等它通過健康檢查。
      postgres:
        condition: service_healthy
        required: false
      guacd:
        condition: service_healthy
    networks:
      - custodexa-network
    restart: always

  # Nginx + Vue 前端服務（生產模式），內建 TLS 代理形態：不發布 host 埠，
  # 對外由下面的 tls-proxy 持有 80 與 443，前端只在內部網路上聽 80。
  frontend:
    <<: *frontend
    profiles: ["builtin-tls"]

  # 同一個前端，自帶入口形態（TLS_MODE=external）：內建代理不啟動，由前端發布 HTTP 埠給你的 ingress。
  # 預設 80，改埠設 .env 的 HTTP_PORT；只讓本機的 ingress 連時建議綁 loopback
  # （HTTP_PORT 改不了介面，直接寫 127.0.0.1:8088:80）。
  #
  # 你的 ingress 轉過來的 Host 標頭要帶上使用者實際連的對外埠（不是 443 時就要有埠號）：
  # 後端以 Origin 對 Host 判同源，Host 少了埠會讓帶憑證的請求被判成跨源。
  # 另外把 .env 的 TRUSTED_PROXIES 設成你的 ingress 位址，來源位址才會歸因到客戶端。
  # 契約與範例設定見 docs/QUICKSTART.md 與 docker/reverse-proxy/nginx-tls.conf.template。
  frontend-published:
    <<: *frontend
    profiles: ["own-ingress"]
    ports:
      - "${HTTP_PORT:-80}:80"

  # 憑證前置步驟：檢查（TLS_MODE=provided）或產生（selfsigned）憑證後結束，代理才啟動。
  # 這一步也保證代理啟動時憑證檔已經在，bind mount 不會把缺檔變成一個空目錄。
  tls-init:
    profiles: ["builtin-tls"]
    image: alpine/openssl:3.5.4
    container_name: custodexa-tls-init
    entrypoint: ["/bin/sh", "/tls-init.sh"]
    environment:
      TLS_MODE: ${TLS_MODE:-selfsigned}
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      TLS_IP_SAN: ${TLS_IP_SAN:-}
      # 只用來把 CA 下載網址印完整
      TLS_HTTPS_PORT: ${TLS_HTTPS_PORT:-443}
    volumes:
      - ./docker/reverse-proxy/tls-init.sh:/tls-init.sh:ro
      - ./tls:/tls
    # 產憑證不需要網路，也不必掛進應用網路
    network_mode: "none"
    restart: "no"

  # 對外的 TLS 終止點：443 走 TLS、80 一律 301 導向 https。
  # 網域取自 .env 的 TLS_DOMAIN，啟動時以 envsubst 展開範本，設定檔不必動手改。
  tls-proxy:
    profiles: ["builtin-tls"]
    # 需要可指名的版本時，把 tag 換成具體版本（例：nginx:1.29.1-alpine）。
    image: nginx:stable-alpine
    container_name: custodexa-tls-proxy
    depends_on:
      frontend:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    # 對外埠預設 443／80，網址不必帶埠號。這台機器上已有服務占用它們時，
    # 在 .env 改 TLS_HTTPS_PORT／TLS_HTTP_PORT（例如 8443／8088），網址就要帶埠。
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      # 導向網址要帶對外埠，故範本裡也用得到它
      TLS_HTTPS_PORT: ${TLS_HTTPS_PORT:-443}
      # 只展開這兩個變數：nginx 設定自己就用 $host、$http_upgrade 等變數，
      # 不設過濾器會把它們一起替換成空字串。
      NGINX_ENVSUBST_FILTER: TLS_DOMAIN|TLS_HTTPS_PORT
    volumes:
      # 範本掛進 /etc/nginx/templates/，官方映像啟動時展開成 conf.d/default.conf，
      # 同時蓋掉映像內建的 default.conf（它會以 welcome 頁兜底吃掉請求）。
      # 要自訂設定就複製一份範本，並在 .env 以 TLS_NGINX_TEMPLATE 指向你的檔案。
      - ${TLS_NGINX_TEMPLATE:-./docker/reverse-proxy/nginx-tls.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./tls/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./tls/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      # 只有 CA 憑證進得了代理容器；CA 私鑰留在主機的 tls/ca-private/ 下，故意不掛。
      # 目錄在 provided 模式是空的，/custodexa-ca.crt 於是回 404。
      - ./tls/ca-public:/etc/nginx/ca-public:ro
    networks:
      - custodexa-network
    restart: always

# audit/recordings/exports/postgres 皆改 ${DATA_PATH:-./data} bind mount，無 named volume
networks:
  custodexa-network:
    driver: bridge
    # 固定子網：quickstart 以這個網段填 .env 的 TRUSTED_PROXIES，讓內建代理轉過來的
    # 來源位址標頭被採信（否則後端看到的來源一律是代理容器，審計紀錄與登入限速都跟著失準）。
    # 網段要能事先寫進 .env，Docker 自動配發的位址做不到這件事。
    # 與主機既有網段衝突時改 .env 的 DOCKER_SUBNET，兩處會一起跟著換。
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.100.0/24}
