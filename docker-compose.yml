services:
  # PostgreSQL 資料庫
  #
  # 基底釘版（2026-08-17 查證）：一律釘到具體版本，不用浮動 major tag。理由有三，
  # 皆非潔癖：(1) AGPL 的「對應源碼」義務要指名交付二進位對應的是哪一版元件；
  # (2) 離線安裝包要能指名包內是哪一版；(3) 漏洞公告要能說「升到 X 版」——浮動 tag
  # 使 X 連自己都不知道。不釘版，這三件事都無法履行。
  # **postgres 是唯一同時「會出貨」且「原本未釘版」的基底**（node 只在建置階段），
  # 故優先序最高：這顆容器帶著使用者的全部資料跑在他們的機房裡。
  # 釘 16.15-alpine3.24：查證當日 postgres:16-alpine ＝ 16.15-alpine ＝ 16.15-alpine3.24
  # （digest 皆 sha256:cf78e766…），故本次釘版不改變任何交付內容，只是把「當時碰巧拉到
  # 什麼」變成「指名拉什麼」。**同時釘 alpine3.24 而非只釘 PG 版本**：這是執行階段映像，
  # OS 套件層 CVE 直接落在使用者的執行環境，故基底 minor 也需可指名（與 frontend 的
  # nginx stage 同理，見 docker/frontend/Dockerfile）。
  # 續期提醒：PostgreSQL 16 的社群支援至 2028-11；升 major 需要 pg_upgrade，不是換 tag。
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: custodexa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-custodexa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    networks:
      - custodexa-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Guacamole Daemon
  guacd:
    image: custodexa/guacd:latest
    build:
      context: .
      dockerfile: docker/guacd/Dockerfile
    container_name: custodexa-guacd
    volumes:
      # 與 backend 共享錄影目錄，讓 guacd 寫出的 RDP/VNC 錄影持久且 backend 可讀
      - ${DATA_PATH:-./data}/recordings:/var/lib/custodexa/recordings
    networks:
      - custodexa-network
    restart: always

  # Go 後端服務（生產模式）
  backend:
    image: custodexa/backend:latest
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
      args:
        # 版本號建置時注入（/health 揭露的版號）。**空值是刻意的**：Dockerfile 於空值時
        # 回退讀專案根 VERSION 檔，那才是單一事實源——不設環境變數的一般建置因此
        # 自動拿到正確版號。
        # 設 VERSION 環境變數只用於覆寫，例：`VERSION=1.0.2-rc1 docker compose -f docker-compose.yml build`
        VERSION: ${VERSION:-}
    container_name: custodexa-backend
    # 使用者可調值（機密/DB 認證/DB_SSLMODE/功能開關/LDAP/運維上限）一律走 .env（與 dev 一致）
    env_file:
      - .env
    # environment: 只留純拓撲/模式常數（compose 提供，且不在 .env 內故無覆寫衝突）
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      AUDIT_LOG_PATH: /var/log/custodexa/audit
      RECORDING_PATH: /var/lib/custodexa/recordings
      # 離機取回暫存根（容器本地快取、非 volume——刻意不掛出：內容是已驗證的
      # 明文副本，容器重建即消失、不進備份範圍）
      OFFSITE_SPOOL_PATH: /var/lib/custodexa/offsite-spool
    volumes:
      - ${DATA_PATH:-./data}/audit:/var/log/custodexa/audit
      - ${DATA_PATH:-./data}/recordings:/var/lib/custodexa/recordings
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    networks:
      - custodexa-network
    restart: always

  # Nginx + Vue 前端服務（生產模式）
  frontend:
    image: custodexa/frontend:latest
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    container_name: custodexa-frontend
    # 不發布 host 埠：對外由下面的 tls-proxy 持有 80 與 443，前端只在內部網路上聽 80。
    # 自帶 ingress 的部署疊上 docker-compose.external-ingress.yml，該檔會關掉內建代理
    # 並把 80 還給前端；見 docs/QUICKSTART.md。
    depends_on:
      - backend
    networks:
      - custodexa-network
    restart: always

  # 憑證前置步驟：檢查（TLS_MODE=provided）或產生（selfsigned）憑證後結束，代理才啟動。
  # 這一步也保證代理啟動時憑證檔已經在，bind mount 不會把缺檔變成一個空目錄。
  tls-init:
    image: alpine/openssl:3.5.4
    container_name: custodexa-tls-init
    entrypoint: ["/bin/sh", "/tls-init.sh"]
    environment:
      TLS_MODE: ${TLS_MODE:-selfsigned}
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      TLS_IP_SAN: ${TLS_IP_SAN:-}
      # 只用來把 CA 下載網址印完整
      TLS_HTTPS_PORT: ${TLS_HTTPS_PORT:-443}
    volumes:
      - ./docker/reverse-proxy/tls-init.sh:/tls-init.sh:ro
      - ./tls:/tls
    # 產憑證不需要網路，也不必掛進應用網路
    network_mode: "none"
    restart: "no"

  # 對外的 TLS 終止點：443 走 TLS、80 一律 301 導向 https。
  # 網域取自 .env 的 TLS_DOMAIN，啟動時以 envsubst 展開範本，設定檔不必動手改。
  tls-proxy:
    # 需要可指名的版本時，把 tag 換成具體版本（例：nginx:1.29.1-alpine）。
    image: nginx:stable-alpine
    container_name: custodexa-tls-proxy
    depends_on:
      frontend:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    # 對外埠預設 443／80，網址不必帶埠號。這台機器上已有服務占用它們時，
    # 在 .env 改 TLS_HTTPS_PORT／TLS_HTTP_PORT（例如 8443／8088），網址就要帶埠。
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      # 導向網址要帶對外埠，故範本裡也用得到它
      TLS_HTTPS_PORT: ${TLS_HTTPS_PORT:-443}
      # 只展開這兩個變數：nginx 設定自己就用 $host、$http_upgrade 等變數，
      # 不設過濾器會把它們一起替換成空字串。
      NGINX_ENVSUBST_FILTER: TLS_DOMAIN|TLS_HTTPS_PORT
    volumes:
      # 範本掛進 /etc/nginx/templates/，官方映像啟動時展開成 conf.d/default.conf，
      # 同時蓋掉映像內建的 default.conf（它會以 welcome 頁兜底吃掉請求）。
      # 要自訂設定就複製一份範本，並在 .env 以 TLS_NGINX_TEMPLATE 指向你的檔案。
      - ${TLS_NGINX_TEMPLATE:-./docker/reverse-proxy/nginx-tls.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./tls/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./tls/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      # 只有 CA 憑證進得了代理容器；CA 私鑰留在主機的 tls/ca-private/ 下，故意不掛。
      # 目錄在 provided 模式是空的，/custodexa-ca.crt 於是回 404。
      - ./tls/ca-public:/etc/nginx/ca-public:ro
    networks:
      - custodexa-network
    restart: always

# audit/recordings/postgres 皆改 ${DATA_PATH:-./data} bind mount，無 named volume
networks:
  custodexa-network:
    driver: bridge
    # 固定子網：quickstart 以這個網段填 .env 的 TRUSTED_PROXIES，讓內建代理轉過來的
    # 來源位址標頭被採信（否則後端看到的來源一律是代理容器，審計紀錄與登入限速都跟著失準）。
    # 網段要能事先寫進 .env，Docker 自動配發的位址做不到這件事。
    # 與主機既有網段衝突時改 .env 的 DOCKER_SUBNET，兩處會一起跟著換。
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.100.0/24}
